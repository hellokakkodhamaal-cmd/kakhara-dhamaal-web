<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.kakkodhamaal.app">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Play Store - Kakkodhamal</title>
  <script type="text/javascript">
    window.location.href = "https://play.google.com/store/apps/details?id=com.kakkodhamaal.app";
  </script>
  <style>
    body {
      background-color: #87d2e3;
      font-family: 'Nunito', 'Segoe UI', sans-serif;
      color: #3e2723;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background-color: #ffffff;
      border: 6px solid #8d6e63;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      max-width: 400px;
      width: 100%;
    }
    h1 {
      font-size: 24px;
      color: #0b5f9e;
      margin-bottom: 10px;
    }
    p {
      font-size: 16px;
      margin-bottom: 20px;
    }
    a {
      display: inline-block;
      background-color: #ff9800;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 24px;
      border-radius: 16px;
      border: 3px solid #e65100;
      box-shadow: 0 4px 0 #e65100;
      transition: transform 0.1s ease;
    }
    a:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #e65100;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Redirecting...</h1>
    <p>We are opening the Google Play Store to download <strong>Kakkodhamal</strong>.</p>
    <p>If you are not redirected automatically in a few seconds, click the button below:</p>
    <a href="https://play.google.com/store/apps/details?id=com.kakkodhamaal.app">Go to Play Store</a>
  </div>
</body>
</html>
